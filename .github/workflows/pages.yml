name: Deploy dashboard to GitHub Pages

# Publishes dashboard.html + logs/ to GitHub Pages whenever the bot commits
# new data (or you push manually). Once enabled, your dashboard is live at:
#   https://<username>.github.io/<repo-name>/dashboard.html

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'logs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site (dashboard + logs only)
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp dashboard.html _site/dashboard.html
          mkdir -p _site/logs
          cp -r logs/* _site/logs/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
